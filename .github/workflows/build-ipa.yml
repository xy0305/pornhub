name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 (iOS 26 SDK)
        run: |
          set -euo pipefail
          XCODE=""
          for p in \
            /Applications/Xcode_26.3.app \
            /Applications/Xcode_26.2.app \
            /Applications/Xcode_26.1.1.app \
            /Applications/Xcode_26.0.1.app \
            /Applications/Xcode_26.app; do
            if [ -d "$p" ]; then XCODE="$p"; break; fi
          done
          if [ -z "$XCODE" ]; then
            echo "Xcode 26 not found. Installed:"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Run native UI architecture contracts
        run: python3 Tests/PlayerChecks/ui_check.py

      - name: Run player architecture regression guards
        run: |
          set -euo pipefail
          python3 Tests/PlayerChecks/check.py
          swiftc -parse-as-library Pornhub/PHSeekSession.swift Tests/PlayerChecks/SeekRegression.swift -o /tmp/ph-seek-tests
          /tmp/ph-seek-tests

      - name: Run catalog regression tests
        run: |
          set -euo pipefail
          python3 Tests/ParserRegression/check.py Tests/Fixtures
          swiftc -parse-as-library \
            Pornhub/PHModels.swift \
            Pornhub/PHParser.swift \
            Pornhub/PHProfileFilters.swift \
            Pornhub/PHSubscriptionParser.swift \
            Pornhub/PHFixtureCheck.swift \
            Tests/ParserRegression/main.swift \
            -o /tmp/pornhub-parser-tests
          PH_FIXTURES="$PWD/Tests/Fixtures" /tmp/pornhub-parser-tests

      - name: Run native touch and menu interaction regressions (Simulator)
        run: |
          set -euo pipefail
          gem install xcodeproj --user-install --no-document
          ruby Tests/PlayerChecks/prepare.rb
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          xcodebuild test -project Pornhub.xcodeproj -scheme Interactions \
            -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" \
            -derivedDataPath "$PWD/SimulatorDerivedData" \
            -resultBundlePath "$PWD/InteractionResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Upload interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: InteractionResults
          path: InteractionResults.xcresult
          if-no-files-found: ignore

      - name: Build unsigned (iphoneos)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Pornhub.xcodeproj \
            -scheme Pornhub \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=YES \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find DerivedData/Build/Products -path '*/Release-iphoneos/*.app' | head -1)
          echo "APP=$APP"
          test -n "$APP" && test -d "$APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          find Payload -name '*.xcent' -delete || true
          find Payload -name 'embedded.mobileprovision' -delete || true
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Payload/Pornhub.app/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Payload/Pornhub.app/Info.plist)
          NAME="Pornhub-unsigned-${VERSION}-${BUILD}.ipa"
          zip -qry "$NAME" Payload
          ls -lh "$NAME"
          echo "IPA_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pornhub-unsigned-ipa
          path: Pornhub-unsigned-*.ipa
          if-no-files-found: error
